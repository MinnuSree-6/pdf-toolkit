<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Toolkit — Real, Free PDF Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --red:#e5322d; --red-dark:#c92823;
    --ink:#22232a; --ink-soft:#6b6f76;
    --bg:#fdf1f5; --card:#ffffff; --border:#f5dbe3;
    --green:#3fa66a; --blue:#2a6fdb; --purple:#8b5ff0; --yellow:#e0a72b; --pink:#e0507d;
  }
  html{overflow-x:hidden;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:transparent;position:sticky;top:0;z-index:20;padding:16px 24px 20px;}
  .nav-wrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:20px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.04);}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--ink);white-space:nowrap;}
  .logo svg{width:24px;height:24px;}
  nav.links{display:flex;align-items:center;gap:26px;}
  nav.links a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;}
  nav.links a:hover{color:var(--red);}
  .auth{display:flex;align-items:center;gap:18px;}
  .plan-badge{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:#eaf6ee;color:var(--green);}
  .plan-badge.free{background:#f1f1f1;color:var(--ink-soft);}
  .auth a.upgrade{background:var(--red);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;}
  .auth a.upgrade:hover{background:var(--red-dark);}
  .auth a.login-link{font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;}
  .auth a.login-link:hover{color:var(--red);}
  .auth a.signup-link{font-size:14px;font-weight:700;color:var(--red);text-decoration:none;cursor:pointer;border:1.5px solid var(--red);padding:9px 16px;border-radius:8px;}
  .auth a.signup-link:hover{background:#fdeee8;}

  .hero{max-width:900px;margin:56px auto 32px;text-align:center;padding:0 24px;}
  .hero h1{font-size:36px;font-weight:800;line-height:1.2;margin-bottom:14px;}
  .hero p{color:var(--ink-soft);font-size:15px;line-height:1.6;max-width:680px;margin:0 auto;}
  .hero .usage-note{margin-top:14px;font-size:13px;color:var(--ink-soft);}

  .grid{max-width:1280px;margin:32px auto 80px;padding:0 24px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;position:relative;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,0.06);}
  .icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
  .card h3{font-size:16px;font-weight:700;margin-bottom:8px;}
  .card p{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .badge{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;}
  .badge.live{background:#eaf6ee;color:var(--green);}
  .badge.pro{background:#fdeee8;color:var(--red);}

  .overlay{position:fixed;inset:0;background:rgba(20,20,20,0.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:28px;position:relative;}
  .modal .close{position:absolute;top:16px;right:18px;cursor:pointer;font-size:20px;color:var(--ink-soft);background:none;border:none;}
  .modal h2{font-size:20px;margin-bottom:6px;}
  .modal p.sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .dropzone{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-bottom:16px;}
  .dropzone:hover{border-color:var(--red);color:var(--red);}
  .filelist{font-size:12px;color:var(--ink-soft);margin-bottom:14px;max-height:100px;overflow:auto;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .run-btn{width:100%;background:var(--ink);color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
  .run-btn:hover{background:#000;}
  .run-btn:disabled{background:#ccc;cursor:not-allowed;}
  .status{margin-top:12px;font-size:13px;text-align:center;color:var(--ink-soft);}
  .status.ok{color:var(--green);font-weight:600;}
  .status.err{color:var(--red);font-weight:600;}

  .pricing{background:#fff;text-align:center;}
  .pricing .price-big{font-size:34px;font-weight:800;margin:10px 0 2px;}
  .pricing .price-sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .pricing ul{list-style:none;text-align:left;margin-bottom:20px;}
  .pricing li{font-size:13px;padding:6px 0;color:var(--ink);}
  .pricing li:before{content:"✓ ";color:var(--green);font-weight:800;}

  @media (max-width:1300px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}nav.links{display:none;}#pricingGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}.hero h1{font-size:26px;}#pricingGrid{grid-template-columns:minmax(0,1fr)!important;}}
  @media (max-width:520px){
    .nav-wrap{padding:12px 14px;gap:8px;}
    .logo{font-size:16px;}
    .plan-badge{display:none;}
    .auth{gap:8px;}
    .auth a.login-link{display:none;}
    .auth a.signup-link{padding:8px 12px;font-size:13px;}
    .auth a.upgrade{padding:8px 12px;font-size:13px;}
  }
</style>
</head>

        <defs>
          <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6a5c"/>
            <stop offset="100%" stop-color="#e5322d"/>
          </linearGradient>
        </defs>
        <path fill="url(#heartGrad)" d="M16 28.5C16 28.5 1 19.6 1 9.7 1 4.6 5 1 9.7 1c3 0 5.4 1.6 6.3 3.9C16.9 2.6 19.3 1 22.3 1 27 1 31 4.6 31 9.7 31 19.6 16 28.5 16 28.5Z"/>

      <a class="login-link" onclick="alert('Demo build — sign-in system not connected yet.')">Login</a>
      <a class="signup-link" onclick="alert('Demo build — sign-up system not connected yet.')">Sign up</a>
      <a class="upgrade" onclick="openUpgrade('pro')">Upgrade</a>
    </div>
  </div>
</header>

<section class="hero">
  <h1>Real PDF tools. Free to use. Yours in seconds.</h1>
</section>

<div class="grid" id="grid"></div>

<section id="pricing" style="max-width:1100px;margin:20px auto 90px;padding:0 24px;">
  <div style="text-align:center;margin-bottom:28px;">
    <h2 style="font-size:26px;font-weight:800;">Upgrade when you need more</h2>
    <p style="color:var(--ink-soft);font-size:14px;">All plans billed in INR · Secure checkout via Razorpay</p>
  </div>
  <div id="pricingGrid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;"></div>
</section>



<div class="overlay" id="toolOverlay">
  <div class="modal" id="toolModal"></div>
</div>

<div class="overlay" id="upgradeOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('upgradeOverlay')">&times;</button>
    <div class="pricing" id="upgradeModalBody"></div>
  </div>
</div>

const grid = document.getElementById('grid');
tools.forEach(t=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="icon" style="background:${t.color}">${t.icon}</div>
    <h3>${t.name}</h3>
    <p>${t.desc}</p>
  `;
  card.onclick = ()=> t.live ? openTool(t.id) : alert(t.name+" needs a server-side engine and will arrive once the Pro backend is connected.");
  grid.appendChild(card);
});

function isPremium(){ return !!localStorage.getItem('pdftk_plan'); }
function getUsage(){
  const today = new Date().toISOString().slice(0,10);
  let u = JSON.parse(localStorage.getItem('pdftk_usage')||'{}');
  if(u.date !== today){ u = {date:today, count:0}; localStorage.setItem('pdftk_usage', JSON.stringify(u)); }
  return u;
}
function incUsage(){
  const u = getUsage(); u.count++;
  localStorage.setItem('pdftk_usage', JSON.stringify(u));
}
function canRun(){ return isPremium() || getUsage().count < 3; }
function refreshPlanUI(){
  c
