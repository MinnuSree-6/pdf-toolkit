<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Toolkit — Real PDF tools, free to use</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --bg:#FCE9ED;
    --card:#FFFFFF;
    --ink:#161522;
    --ink-soft:#5b596b;
    --accent:#E43A55;
    --border:#F5D3DB;
    --dark-btn:#161522;
    --success:#1E9E6B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:var(--bg); position:sticky; top:0; z-index:50;
    border-bottom:1px solid rgba(0,0,0,0.03);
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; }
  .brand span.heart{ color:var(--accent); }
  .header-actions{ display:flex; gap:10px; }
  .btn{
    border-radius:999px; padding:10px 20px; font-weight:600; font-size:14px;
    border:none; cursor:pointer; transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-outline{ background:transparent; border:1.5px solid var(--accent); color:var(--accent); }
  .btn-solid{ background:var(--accent); color:#fff; }
  .btn-dark{ background:var(--dark-btn); color:#fff; width:100%; padding:14px; font-size:15px; border-radius:999px; }
  .btn-dark:disabled{ opacity:.45; cursor:not-allowed; }

  main{ max-width:1040px; margin:0 auto; padding:36px 20px 90px; }
  .hero h1{ font-size:clamp(28px,4vw,42px); line-height:1.15; text-align:center; margin:10px 0 6px; }
  .hero p.sub{ text-align:center; color:var(--ink-soft); margin-bottom:34px; font-size:16px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px; margin-bottom:44px; }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:22px;
    padding:22px; display:flex; flex-direction:column; gap:10px; min-height:170px;
  }
  .icon{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:18px;
  }
  .card h3{ margin:2px 0 0; font-size:18px; }
  .card p.desc{ margin:0; color:var(--ink-soft); font-size:14px; line-height:1.4; flex-grow:1; }
  .card.disabled p.desc{ font-style:normal; }
  .badge-soon{ font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.03em; text-transform:uppercase; }

  .tool-open{ background:var(--dark-btn); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; align-self:flex-start; }
  .tool-open:hover{ opacity:.9; }

  section.section-title{ font-size:22px; font-weight:700; margin:44px 0 18px; }

  .pricing-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; }
  .plan{ background:var(--card); border:1px solid var(--border); border-radius:22px; padding:26px; text-align:center; }
  .plan .eyebrow{ color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.04em; }
  .plan .price{ font-size:34px; font-weight:800; margin:6px 0 4px; }
  .plan .price sub{ font-size:14px; color:var(--ink-soft); font-weight:500; }
  .plan .tag{ color:var(--ink-soft); font-size:14px; margin-bottom:14px; }
  .plan ul{ list-style:none; padding:0; margin:0 0 18px; text-align:left; }
  .plan ul li{ font-size:14px; padding:4px 0; padding-left:20px; position:relative; color:var(--ink); }
  .plan ul li::before{ content:"•"; position:absolute; left:0; color:var(--accent); }
  .footnote{ text-align:center; color:var(--ink-soft); font-size:13px; margin-top:30px; }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(20,20,30,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .overlay.active{ display:flex; }
  .modal{ background:#fff; border-radius:20px; padding:26px; max-width:480px; width:100%; max-height:86vh; overflow-y:auto; }
  .modal h2{ margin-top:0; font-size:20px; }
  .modal .close{ float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); }
  .drop{
    border:2px dashed var(--border); border-radius:16px; padding:28px 14px; text-align:center;
    color:var(--ink-soft); font-size:14px; cursor:pointer; margin:14px 0;
  }
  .drop.drag{ border-color:var(--accent); color:var(--accent); }
  .filelist{ font-size:13px; margin:10px 0; max-height:140px; overflow-y:auto; }
  .filelist div{ padding:6px 10px; background:#FBF3F5; border-radius:10px; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; }
  .opt-row{ margin:12px 0; font-size:14px; }
  .opt-row label{ display:block; margin-bottom:6px; font-weight:600; }
  .opt-row input[type=text], .opt-row input[type=number]{
    width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border); font-size:14px;
  }
  .status{ font-size:13px; margin-top:10px; min-height:18px; }
  .status.ok{ color:var(--success); }
  .status.err{ color:var(--accent); }
  .hidden-input{ display:none; }
</style>
</head>

<div class="overlay" id="overlay">

<script>

  {id:'compare', name:'Compare PDF', color:'#3B7DE0', icon:'⤨', desc:'Side-by-side comparison — coming with Pro backend.', live:false},

  {id:'pdf2word', name:'PDF to Word', color:'#3B7DE0', icon:'W', desc:'Requires a server-side engine — coming with Pro backend.', live:false},
  {id:'pdf2ppt', name:'PDF to PowerPoint', color:'#E53E3E', icon:'P', desc:'Requires a server-side engine — coming with Pro backend.', live:false},
  {id:'pdf2xls', name:'PDF to Excel', color:'#2FAE6B', icon:'X', desc:'Requires a server-side engine — coming with Pro backend.', live:false},
  {id:'word2pdf', name:'Word to PDF', color:'#3B7DE0', icon:'W', desc:'Requires a server-side engine — coming with Pro backend.', live:false},
  {id:'ppt2pdf', name:'PowerPoint to PDF', color:'#E53E3E', icon:'P', desc:'Requires a server-side engine — coming with Pro backend.', live:false},
  {id:'xls2pdf', name:'Excel to PDF', color:'#2FAE6B', icon:'X', desc:'Requires a server-side engine — coming with Pro backend.', live:false},

  {id:'pdfa', name:'PDF to PDF/A', color:'#3B7DE0', icon:'▤', desc:'Archive-standard conversion — coming with Pro backend.', live:false},
  {id:'repair', name:'Repair PDF', color:'#2FAE6B', icon:'🔧', desc:'Recover data from a damaged file — coming with Pro backend.', live:false},
  {id:'forms', name:'PDF Forms', color:'#8B5CF6', icon:'☑', desc:'Create or fill fillable forms — coming with Pro backend.', live:false},
  {id:'aisum', name:'AI Summarizer', color:'#3B7DE0', icon:'✦', desc:'AI-generated summaries — coming with Pro backend.', live:false},
  {id:'translate', name:'Translate PDF', color:'#E4547A', icon:'🌐', desc:'AI-powered translation — coming with Pro backend.', live:false},
  {id:'md', name:'PDF to Markdown', color:'#8B5CF6', icon:'▤', desc:'Convert PDFs into clean Markdown — coming with Pro backend.', live:false},

const PLANS = [
  {id:'weekly', label:'WEEKLY', price:99, unit:'/week', tag:'Great for a short-term crunch.', features:['Unlimited jobs for 7 days','No daily limit','Cancel anytime']},
  {id:'monthly', label:'MONTHLY', price:349, unit:'/month', tag:'Best value for regular use.', features:['Unlimited jobs for 1 month','No daily limit','Cancel anytime']},
  {id:'pro', label:'PRO · MOST POPULAR', price:649, unit:'/month', tag:'Our most popular plan.', features:['Unlimited daily jobs','Larger file size support','Priority access to new tools']},
  {id:'max', label:'MAX', price:949, unit:'/month', tag:'For power users and teams.', features:['Everything in Pro','Higher file size & usage limits','Priority access & support']},
];

/* ---------------- RENDER GRID ---------------- */
const grid = document.getElementById('toolGrid');
TOOLS.forEach(t=>{
  const card = document.createElement('div');
  card.className = 'card' + (t.live ? '' : ' disabled');
  card.innerHTML = `
    <div class="icon" style="background:${t.color}">${t.icon}</div>
    <h3>${t.name}</h3>
    <p class="desc">${t.desc}</p>
    ${t.live ? `<button class="tool-open" data-tool="${t.id}">Open tool</button>` : ``}
  `;
  grid.appendChild(card);
});
grid.addEventListener('click', e=>{
  const btn = e.target.closest('.tool-open');
  if(btn) openTool(btn.dataset.tool);
});

const pricingGrid = document.getElementById('pricingGrid');
PLANS.forEach(p=>{
  const el = document.createElement('div');
  el.className = 'plan';
  el.innerHTML = `
    <div class="eyebrow">${p.label}</div>
    <div class="price">₹${p.price}<sub>${p.unit}</sub></div>
    <div class="tag">${p.tag}</div>
    <ul>${p.features.map(f=>`<li>${f}</li>`).join('')}</ul>
    <button class="btn btn-dark" data-plan="${p.id}">Choose ${p.label.split(' ')[0].charAt(0)+p.label.split(' ')[0].slice(1).toLowerCase()}</button>
  `;
  pricingGrid.appendChild(el);
});
pricingGrid.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-plan]');
  if(btn) startCheckout(btn.dataset.plan);
});

/* ---------------- MODAL HELPERS ---------------- */
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
function closeModal(){ overlay.classList.remove('active'); modalBody.innerHTML=''; }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

function showModal(html){
  modalBody.innerHTML = `<button class="close" onclick="closeModal()">✕</button>` + html;
  overlay.classList.add('active');
}

function setupDropzone(dz, input, multiple, onFiles){
  dz.addEventListener('click', ()=>input.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('drag');
    onFiles(multiple ? Array.from(e.dataTransfer.files) : [e.dataTransfer.files[0]]);
  });
  input.addEventListener('change', ()=>{
    onFiles(multiple ? Array.from(input.files) : [input.files[0]]);
  });
}

function fileListHTML(files){
  return `<div class="filelist">${files.map(f=>`<div><span>${f.name}</span><span>${(f.size/1024).toFixed(0)} KB</span></div>`).join('')}</div>`;
}

function setStatus(el, msg, kind){
  el.textContent = msg;
  el.className = 'status' + (kind ? ' '+kind : '');
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ---------------- TOOL IMPLEMENTATIONS ---------------- */
const { PDFDocument, degrees, rgb, StandardFonts } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function openTool(id){
  const map = {
    merge: toolMerge, split: toolSplit, rotate: toolRotate,
    pdf2jpg: toolPdf2Jpg, jpg2pdf: toolJpg2Pdf, watermark: toolWatermark,
    crop: toolCrop, organize: toolOrganize, pagenum: toolPageNum, compress: toolCompress,
  };
  map[id]();
}

/* MERGE */
function toolMerge(){
  showModal(`
    <h2>Merge PDF</h2>
    <p style="color:var(--ink-soft);font-size:14px">Add PDFs in the order you want them merged.</p>
    <div class="drop" id="dz">Tap or drop PDF files here (multiple allowed)</div>
    <input type="file" id="fi" class="hidden-input" accept="application/pdf" multiple>
    <div id="flist"></div>
    <button class="btn-dark" id="run" disabled>Merge & download</button>
    <div class="status" id="st"></div>
  `);
  let files = [];
  const dz=document.getElementById('dz'), fi=document.getElementById('fi'), run=document.getElementById('run'), st=document.getElementById('st'), flist=document.getElementById('flist');
  setupDropzone(dz, fi, true, fs=>{
    files = files.concat(fs.filter(f=>f.type==='application/pdf'));
    flist.innerHTML = fileListHTML(files);
    run.disabled = files.length < 2;
  });
  run.onclick = async ()=>{
    setStatus(st,'Merging…');
    try{
      const merged = await PDFDocument.create();
      for(const f of files){
        const bytes = await f.arrayBuffer();
        const src = await PDFDocument.load(bytes);
        const pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(p=>merged.addPage(p));
      }
      const out = await merged.save();
      downloadBlob(new Blob([out],{type:'application/pdf'}), 'merged.pdf');
      setStatus(st,'Done — download started.','ok');
    }catch(e){ setStatus(st,'Error: '+e.message,'err'); }
  };
}

/* SPLIT */
function toolSplit(){
  showModal(`
    <h2>Split PDF</h2>
    <p style="color:var(--ink-soft);font-size:14px">Every page becomes its own PDF, zipped together.</p>
    <div class="drop" id="dz">Tap or drop a PDF file here</div>
    <input type="file" id="fi" class="hidden-input" accept="application/pdf">
    <div id="flist"></div>
    <button class="btn-dark" id="run" disabled>Split & download ZIP</button>
    <div class="status" id="st"></div>
  `);
  let file=null;
  const dz=document.getElementById('dz'), fi=document.getElementById('fi'), run=document.getElementById('run'), st=document.getElementById('st'), flist=document.getElementById('flist');
  setupDropzone(dz, fi, false, fs=>{ file=fs[0]; flist.innerHTML=fileListHTML([file]); run.disabled=!file; });
  run.onclick = async ()=>{
    setStatus(st,'Splitting…');
    try{
      const bytes = await file.arrayBuffer();
      const src = await PDFDocument.load(bytes);
      const zip = new JSZip();
      for(let i=0;i<src.getPageCount();i++){
        const doc = await PDFDocument.create();
        const [p] = await doc.copyPages(src,[i]);
        doc.addPage(p);
        const out = await doc.save();
        zip.file(`page-${i+1}.pdf`, out);
      }
      const blob = await zip.generateAsync({type:'blob'});
      downloadBlob(blob, 'split-pages.zip');
      setStatus(st,'Done — download started.','ok');
    }catch(e){ setStatus(st,'Error: '+e.message,'err'); }
  };
}

/* ROTATE */
function toolRotate(){
  showModal(`
    <h2>Rotate PDF</h2>
    <p style="color:var(--ink-soft);font-size:14px">Rotates every page 90° clockwise.</p>
    <div class="drop" id="dz">Tap or drop a PDF file here</div>
    <input type="file" id="fi" class="hidden-input" accept="application/pdf">
    <div id="flist"></div>
    <button class="btn-dark" id="run" disabled>Rotate & download</button>
    <div class="status" id="st"></div>
  `);
  let file=null;
  const dz=document.getElementById('dz'), fi=document.getElementById('fi'), run=document.getElementById('run'), st=document.getElementById('st'), flist=document.getElementById('flist');
  setupDropzone(dz, fi, false, fs=>{ file=fs[0]; flist.innerHTML=fileListHTML([file]); run.disabled=!file; });
  run.onclick = async ()=>{
    setStatus(st,'Rotating…');
    try{
      const bytes = await file.arrayBuffer();
      const doc = await PDFDocument.load(bytes);
      doc.getPages().forEach(p=>{
        const cur = p.getRotation().angle;
        p.setRotation(degrees(cur+90));
      });
      const out = await doc.save();
      downloadBlob(new Blob([out],{type:'application/pdf'}), 'rotated.pdf');
      setStatus(st,'Done — download started.','ok');
    }catch(e){ setStatus(st,'Error: '+e.message,'err'); }
  };
}

/* PDF TO JPG */
function toolPdf2Jpg(){
  showModal(`
    <h2>PDF to JPG</h2>
    <p style="color:var(--ink-soft);font-size:14px">Every page is exported as a JPG, zipped together.</p>
    <div class="drop" id="dz">Tap or drop a PDF file here</div>
    <input type="file" id="fi" class="hidden-input" accept="application/pdf">
    <div id="flist"></div>
    <button class="btn-dark" id="run" disabled>Convert & download ZIP</button>
    <div class="status" id="st"></div>
  `);
  let file=null;
  const dz=document.getElementById('dz'), fi=document.getElementById('fi'), run=document.getElementById('run'), st=document.getElementById('st'), flist=document.getElementById('flist');
  setupDro this the notepad code
